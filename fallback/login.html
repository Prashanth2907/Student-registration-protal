<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg portal-navbar">
        <div class="container-fluid">
            <span class="navbar-brand me-4">Unified Login</span>
            <div class="collapse navbar-collapse show">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">Signup</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="auth-card">
            <h3 class="card-title-custom">Account Login</h3>

            <div id="loginAlert" style="display: none;"></div>

            <form id="simulationLoginForm">
                <div class="mb-3">
                    <label class="form-label text-secondary small fw-bold">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="Email Address (email)" required>
                </div>
                <div class="mb-2">
                    <label class="form-label text-secondary small fw-bold">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Password (password)" required>
                </div>
                <div class="mb-4">
                    <a href="forgot_password.html" class="text-decoration-none small text-primary">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>
        </div>
    </div>

    <footer class="portal-footer">
        Basic Coding Test - 1 | Unified Login | Task Document
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/simulation.js"></script>
</body>
</html>
